<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
        rel="stylesheet">
    <title>Math Training</title>
</head>

<body class="h-[100vh] bg-linear-to-r from-cyan-500 to-purple-900 font-[JetBrains_Mono]">
    <main class="flex justify-center align-center">
        <div
            class="bg-red-50 h-[auto] px-[150px] py-[40px] mt-[100px] rounded-lg shadow-xl/30  border-2 border-gray-950">
            <h1 class="text-6xl">Math Training</h1>
            <div class="flex flex-col ml-[25%] w-[100%] mt-[20px]">
                <a href="eazy-page.html"
                    class="px-5 py-2.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-medium shadow-sm hover:shadow transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2 mt-[5px] w-[50%] text-center">Eazy</a>
                <a href="medium-page.html"
                    class="px-5 py-2.5 rounded-lg bg-amber-500 hover:bg-amber-600 active:bg-amber-700 text-white font-medium shadow-sm hover:shadow transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-amber-400 focus:ring-offset-2 mt-[5px] w-[50%] text-center">Medium</a>
                <a href="hard-page.html"
                    class="px-5 py-2.5 rounded-lg bg-red-600 hover:bg-red-700 active:bg-red-800 text-white font-medium shadow-sm hover:shadow transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2 mt-[5px] w-[50%] text-center">Hard</a>
                <button
                    class="px-5 py-2.5 rounded-lg bg-zinc-900 hover:bg-black active:bg-zinc-800 text-white font-medium shadow-sm hover:shadow transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-zinc-900 focus:ring-offset-2 mt-[5px] cursor-pointer w-[50%]"
                    onclick="quitApp()">Quit</button>
                <a href="tutorial.html"
                    class="px-5 py-2.5 rounded-lg bg-orange-950 hover:bg-orange-900 active:bg-orange-950 text-white font-medium shadow-sm hover:shadow transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-orange-950 focus:ring-offset-2 mt-[5px] w-[50%] text-center">Tutorial</a>
            </div>
        </div>
    </main>
</body>
<script>
    function quitApp() {
        window.close()
    }
</script>

</html>
